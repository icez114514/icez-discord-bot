w button{padding:8px;font-size:12px}.lobby-desc{flex-direction:column;gap:10px}.c-lobby,.d-lobby{padding:35px 20px}.c-lobby .lobby-list{grid-template-columns:1fr}.c-lobby .lobby-row{gap:10px}.switcher{bottom:10px;padding:6px;gap:1px;border-radius:12px}.switcher .switch-label{display:none}.switcher button{padding:7px 9px;font-size:10px}.switcher .arrow{padding:5px 7px}.toast{bottom:78px;width:max-content}.b-main .lobby{padding-top:5px}}

</style></head><body><div id="root"></div><div id="overlay"></div><div id="toast" role="status"></div>
<script>
const variants={A:{name:'霧松俱樂部',desc:'灰綠毛氈・安靜的會員俱樂部'},B:{name:'瓷白藍灰',desc:'明亮留白・清透的日間牌桌'},C:{name:'暮紫夜桌',desc:'煙紫深色・專注每一次決定'},D:{name:'砂岩牌室',desc:'砂色紙感・克制的私人牌室'}};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants[variant])variant='A';let screen='table',acted=false,room='晚餐後來幾手',toastTimer;
const root=document.getElementById('root'),overlay=document.getElementById('overlay');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function brand(){return '<div class="brand"><span class="mark">♠</span><div>牌間<small>和熟悉的人，打一手。</small></div></div>'}
function nav(){return `<nav class="nav" aria-label="主要功能"><button data-nav="lobby" class="${screen==='lobby'?'active':''}">公開大廳</button><button data-nav="table" class="${screen==='table'?'active':''}">我的牌桌</button><button data-info="stats">我的數據</button></nav>`}
function account(){return '<div class="account"><div><span class="muted">可用籌碼</span><strong>46,000</strong></div><span class="avatar">墨</span></div>'}
function roomtop(){return `<div class="roomtop"><div class="page-title"><h1>${esc(room)}</h1><p>公開桌　／　小盲 50　大盲 100</p></div><div class="round-info">第 24 手<strong>5 / 6 席</strong></div></div>`}
function card(n,s){return `<div class="playing-card ${['♥','♦'].includes(s)?'red':''}" aria-label="${n}${s}"><span class="corner">${n}<small>${s}</small></span><span class="suit">${s}</span></div>`}
function seat(pos,name,balance,move,npc=false,dealer=false){return `<div class="player ${pos}"><div class="bubble"><div class="name">${name}${npc?'<span class="type">NPC</span>':''}${dealer?'<span class="disc">D</span>':''}</div><div class="balance">${balance}</div></div><div class="move">${move}</div></div>`}
function table(){return `<div class="table-stage"><div class="table-surface"><div class="board"><div class="pot-label">底池</div><div class="pot"><span class="chips"><i></i><i></i></span>1,200</div><div class="board-cards">${card('A','♦')+card('9','♣')+card('6','♥')}<div class="playing-card back" aria-label="尚未發出的轉牌"></div><div class="playing-card back" aria-label="尚未發出的河牌"></div></div><div class="board-note">翻牌圈　${acted?'等待其他玩家':'輪到你行動'}</div></div></div>${seat('north','海鹽','6,250','已過牌',false,true)}${seat('nw','阿澤','3,600','下注 200')}${seat('ne','松','9,800','跟注 200',true)}${seat('sw','霧','7,400','已棄牌',true)}<div class="player se empty"><div class="bubble">空位</div></div><div class="player hero"><div class="hand">${card('A','♠')+card('K','♥')}</div><div class="bubble"><div class="name">你 <span class="type">${acted?'已行動':'思考中'}</span></div><div class="balance">3,800</div></div></div></div>`}
function actions(){return `<div class="action-panel"><div class="turnline"><span>${acted?'等待其他玩家':'你的回合'}</span><span><b>${acted?'—':'15'}</b> <span class="muted">秒</span></span></div><div class="time-track"><span style="width:${acted?0:75}%"></span></div><div class="buttons"><button data-play="棄牌" ${acted?'disabled':''}>棄牌<small>放棄本手</small></button><button data-play="跟注 200" ${acted?'disabled':''}>跟注<small>200 籌碼</small></button><button class="primary" data-modal="raise" ${acted?'disabled':''}>加注<small>選擇金額</small></button></div><div class="bank"><span>補時池　60 / 60 秒</span><span>自動 +5 秒　最多 4 次</span></div></div>`}
function tools(){return '<div class="toolrow"><button data-modal="topup">補碼</button><button data-info="sit">下手坐出</button><button data-modal="leave">離桌</button><button data-reset>重播示範</button></div>'}
function activity(){return '<section class="activity"><h3>本手動態</h3><p><span>海鹽</span><b>過牌</b></p><p><span>阿澤</span><b>下注 200</b></p><p><span>松 <small>NPC</small></span><b>跟注 200</b></p><div class="divider"></div><h3>我的牌桌</h3><div class="detail-line"><span>本次帶入</span><strong>4,000</strong></div><div class="detail-line"><span>本手投入</span><strong>200</strong></div><div class="detail-line"><span>手後補碼</span><strong>無</strong></div></section>'}
function lobby(){return `<section class="lobby"><div class="lobby-head"><div><h1>今晚，坐哪一桌？</h1><p>50 / 100 盲注。帶入 2,000～10,000 籌碼。</p></div><button class="primary" data-modal="create">開新桌</button></div><div class="lobby-list">${['晚餐後來幾手','留一盞燈'].map((n,i)=>`<article class="lobby-row"><div><h3><span class="mini-table"></span>${n}</h3><p class="muted">${i?'固定高手 NPC 陪你練習':'真人與固定 NPC 同桌'}</p></div><span class="muted">${i?3:5} / 6 席</span><span class="muted">50 / 100</span><button class="subtle" data-join="${n}">選擇帶入</button></article>`).join('')}</div><div class="lobby-desc"><span><span class="online"></span>指定 Discord 社群的私人聚所</span><button data-modal="invite">用私人桌邀請加入</button></div></section>`}
function VariantA(){return `<div class="a-layout"><aside class="a-rail">${brand()}${nav()}<div class="rail-bottom"><span class="online"></span>已連線<br><br>固定高手 NPC<br>單一難度，隨時入座。</div></aside><main class="a-main"><header class="header"><div class="eyeline"><span class="online"></span>朋友的牌間 <span class="badge">Discord 社群</span></div>${account()}</header>${screen==='lobby'?lobby():`<div class="a-content"><div>${roomtop()}${table()}${actions()}${tools()}</div>${activity()}</div>`}</main></div>`}
function VariantB(){return `<header class="header b-header">${brand()}${nav()}${account()}</header><main class="b-main">${screen==='lobby'?lobby():`${roomtop()}${table()}<div class="b-shelf"><div class="shelf-title"><h3>慢慢想，輪到你。</h3><p>牌桌上的每一步<br>都由你決定。</p></div>${actions()}</div>${tools()}`}</main>`}
function VariantC(){return `<header class="header c-header">${brand()}${nav()}${account()}</header>${screen==='lobby'?`<main class="c-lobby">${lobby()}</main>`:`<main class="c-layout"><section class="c-stage">${roomtop()}${table()}<div class="stage-caption"><span><span class="online"></span>連線穩定</span><span>再完成 6 手，補時池獲得 +5 秒</span></div></section><aside class="c-console"><p class="console-title">這一手，由你決定。</p>${actions()}${activity()}${tools()}</aside></main>`}`}
function VariantD(){return `<header class="header d-header">${brand()}${nav()}${account()}</header>${screen==='lobby'?`<main class="d-lobby">${lobby()}</main>`:`<main class="d-layout"><aside class="d-details">${roomtop()}${activity()}${tools()}</aside><section class="d-play">${table()}${actions()}<p class="footer-note">再完成 6 手，補時池獲得 +5 秒</p></section></main>`}`}
function PrototypeSwitcher(){return `<nav class="switcher" aria-label="美術原型切換"><span class="switch-label">美術提案<br>← → 切換</span><button class="arrow" data-cycle="-1" aria-label="上一種風格">‹</button>${Object.entries(variants).map(([k,v])=>`<button data-variant="${k}" class="${k===variant?'selected':''}" aria-pressed="${k===variant}">${k} ${v.name}</button>`).join('')}<button class="arrow" data-cycle="1" aria-label="下一種風格">›</button></nav>`}
function render(){document.body.dataset.variant=variant;root.innerHTML=`<div class="app"><div class="prototype-note"><span>美術原型 ${variant}　${variants[variant].desc}</span><span>模擬資料・可切換大廳與牌桌</span></div>${({A:VariantA,B:VariantB,C:VariantC,D:VariantD})[variant]()}</div>${PrototypeSwitcher()}`}
function changeVariant(v){variant=v;const url=new URL(location.href);url.searchParams.set('variant',v);history.replaceState(null,'',url);overlay.innerHTML='';render()}
function cycle(d){const keys=Object.keys(variants);changeVariant(keys[(keys.indexOf(variant)+d+4)%4])}
function notify(t){clearTimeout(toastTimer);document.getElementById('toast').innerHTML=`<div class="toast">${esc(t)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',4000)}
function dialog(type,name){const config={raise:['加注至','包含本街已投入的籌碼。此處僅示範操作外觀。','600','確認加注'],topup:['手後補碼','本手結束後才會增加桌上籌碼。','2000','申請補碼'],leave:['本手結束後離桌','剩餘籌碼會在結算後退回帳戶，補時池保留。',null,'確認離桌'],create:['開一張新桌','示範建立公開桌，盲注 50 / 100。','4000','開桌並入座'],invite:['私人桌邀請','以 FRIENDS 示範邀請碼進入私人桌。','FRIENDS','查看牌桌'],join:['帶入籌碼',name+'。帶入範圍 2,000～10,000。','4000','入座']};const [title,desc,value,submit]=config[type];overlay.innerHTML=`<div class="shade"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">${title}</h2><p>${esc(desc)}</p>${value!==null?`<label for="amount">${type==='invite'?'邀請碼':'籌碼'}</label><input id="amount" ${type==='invite'?'type="text"':'type="number" min="1"'} value="${value}">`:''}<div class="buttons"><button class="subtle" data-close>取消</button><button class="primary" data-submit="${type}" data-room="${esc(name||'朋友小聚')}">${submit}</button></div></section></div>`;overlay.querySelector('input,button').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.variant){changeVariant(b.dataset.variant);return}if(b.dataset.cycle){cycle(Number(b.dataset.cycle));return}if(b.dataset.nav){screen=b.dataset.nav;render();return}if(b.dataset.join){dialog('join',b.dataset.join);return}if(b.dataset.modal){dialog(b.dataset.modal);return}if(b.hasAttribute('data-close')){overlay.innerHTML='';return}if(b.hasAttribute('data-reset')){acted=false;render();notify('已回到你的回合。');return}if(b.dataset.info){notify(b.dataset.info==='stats'?'個人數據將包含 VPIP、PFR 等；本頁先比較美術。':'已預約下手坐出（示範）。');return}if(b.dataset.play){acted=true;render();notify('已'+b.dataset.play+'（示範）。');return}if(b.dataset.submit){const type=b.dataset.submit,val=overlay.querySelector('input')?.value;if(['join','create'].includes(type)&&(!Number.isInteger(Number(val))||Number(val)<2000||Number(val)>10000)){notify('帶入請填 2,000～10,000 的整數。');return}overlay.innerHTML='';if(['join','create','invite'].includes(type)){screen='table';room=type==='invite'?'朋友私人桌':b.dataset.room;acted=false;render();notify('已入座（示範）。')}else if(type==='leave'){screen='lobby';render();notify('示範返回大廳；正式版於本手結算後離桌。')}else if(type==='raise'){acted=true;render();notify('已加注至 '+val+'（示範）。')}else notify('已預約手後補碼（示範）。')}});
document.addEventListener('keydown',e=>{if(overlay.innerHTML){if(e.key==='Escape')overlay.innerHTML='';if(e.key==='Tab'){const list=[...overlay.querySelectorAll('input,button')];if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus()}}return}if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});render();
</script></body></html>
