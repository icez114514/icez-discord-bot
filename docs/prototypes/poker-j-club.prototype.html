/* J — walnut club: warm casing, muted forest felt, restrained engraved brass. */
body{--bg:#2b2925;--ink:#eee8da;--muted:#b9af9c;--line:#625b4c;--accent:#c3b28c;--on:#3f3728;--panel:#4b473b;--red:#9f5b53;--black:#344a40}
body .h-top{border-bottom-color:#7c6e4c77}
body .logo{font-family:Georgia,'PMingLiU',serif;letter-spacing:5px;font-size:23px}
body .roomhead h1{font-family:'PMingLiU',serif;letter-spacing:2px}
body .h-floor{background:radial-gradient(ellipse at 50% 55%,#8b75541c,transparent 67%)}
body .h-table{background:radial-gradient(ellipse at center,#506356,#3b5146);border-color:#76604b;box-shadow:0 2px 0 #b7a17a,0 10px 0 #4c3d32,0 14px 0 #322a25,0 32px 40px #15120e88,inset 0 0 0 2px #c1ae8066,inset 0 0 45px #23362966}
body .h-table:before{border:2px double #b9aa7955;inset:19px}
body .h-table:after{content:'♠  牌間  ♠';color:#cfbf8e4d;font-size:17px;letter-spacing:8px}
body .h-scene .person{background:#383b32;border-color:#8b8060;border-radius:5px;box-shadow:inset 0 0 0 3px #b8a97a0a,0 5px 12px #17191366}
body .h-scene .person .portrait{border:2px solid #baaa81;box-shadow:0 0 0 3px #33372c;filter:sepia(.2)}
body .h-center .card,body .h-hero .card{background:#f4eedc;border-radius:4px;border:1px solid #e1d7bb}
body .h-center .card{box-shadow:0 4px 0 #b0a78b,0 8px 10px #1b302266}
body .h-center .card.blank{background:repeating-linear-gradient(45deg,#344b40,#344b40 4px,#3b5146 4px,#3b5146 5px);border-color:#ac9c6866;box-shadow:0 3px 0 #293a30}
body .h-center .card.blank:after{content:'♠';color:#b9ab7d;font-size:20px}
body .h-center .pot strong{font-family:Georgia,serif;color:#e2d9bc;text-shadow:0 2px 3px #20322588}
body .h-hero .hero-info{background:#46513f;border-color:#c0ae7b;border-radius:4px;box-shadow:0 0 0 3px #baaa8122}
body .h-bottom .action-buttons button{background:#434336;border-color:#716d54;border-radius:4px;box-shadow:0 3px 0 #26271e}
body .h-bottom .action-buttons .primary{background:#c3b28c;box-shadow:0 3px 0 #897955}
body .h-lobby .room-row{background:linear-gradient(140deg,#485344,#303a30);border-color:#8b8060;border-radius:6px}

/* Keep the room subdued; playing cards deliberately carry high contrast. */
body{--red:#c51e32;--black:#14191e}
body .h-center .card:not(.blank),body .h-hero .card,body .card-detail .card{background:#fffefb;border:1px solid #ffffff;border-radius:5px;color:var(--black);filter:none;opacity:1;font-family:Georgia,'Times New Roman',serif}
.h-center .card.red,.h-hero .card.red,.card-detail .card.red{color:var(--red)}
.h-center .card:not(.blank){width:65px;height:88px;box-shadow:0 4px 0 #aaa99e,0 8px 11px #15241988}
.h-center .card:not(.blank) .value{font-size:26px;font-weight:700;left:7px;top:6px}
.h-center .card:not(.blank) .value small{font-size:15px;font-weight:400;margin-top:2px}
.h-center .card:not(.blank) .suit{font-size:35px;bottom:6px;right:7px}
.h-center .card.blank{width:65px;height:88px;opacity:.7}
.h-hero .card .value{font-weight:700;font-size:24px}
.h-hero .card .suit{font-size:32px}
.card-detail{width:min(560px,100%)}.card-detail .cards{gap:12px;margin:28px 0 30px}.card-detail .card{width:94px;height:132px;box-shadow:0 4px 0 #9c9c91,0 10px 20px #0002}.card-detail .card .value{font-size:36px;font-weight:700;top:9px;left:10px}.card-detail .card .value small{font-size:21px}.card-detail .card .suit{font-size:46px;bottom:10px;right:10px}

</style></head><body><div id="root"></div><div id="overlay"></div><div id="toast" role="status"></div><script>
const designs={M:['典藏胡桃','胡桃木、深綠毛氈、細古銅圈'],N:['墨藍橡木','橡木桌緣、墨藍毛氈、銀銅細節'],O:['酒紅皮革','深木框、低飽和酒紅、皮革滾邊'],P:['煙燻橄欖','煙燻木色、橄欖毛氈、霧金窄框']};let variant=new URLSearchParams(location.search).get('variant')||'M';if(!designs[variant])variant='M';let screen='table',acted=false,room='晚餐後來幾手';const root=document.getElementById('root'),overlay=document.getElementById('overlay');let timer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function logo(){return '<div class="logo"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 3 5 20c-8 11 9 19 15 8 6 11 23 3 15-8L20 3Z" fill="currentColor"/><path d="m20 26-6 11h12z" fill="currentColor"/></svg>牌間</div>'}
function nav(){return `<nav class="nav" aria-label="主要功能"><button data-nav="lobby" class="${screen==='lobby'?'active':''}">公開大廳</button><button data-nav="table" class="${screen==='table'?'active':''}">我的牌桌</button><button data-info="stats">我的數據</button></nav>`}
function wallet(){return '<div class="wallet">可用籌碼<b>46,000</b></div>'}
function roomhead(){return `<div class="roomhead"><div><h1>${esc(room)}</h1><p>公開桌　小盲 50 ／ 大盲 100</p></div><span class="badge">第 24 手</span></div>`}
function portrait(i){const fills=['#899b98','#a3a294','#7c959a','#a69aa8','#93a28c'];return `<div class="portrait"><svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" fill="${fills[i%5]}"/><circle cx="25" cy="19" r="10" fill="#e1e3d9"/><path d="M4 49C3 27 45 24 46 49" fill="#4c625e"/><path d="M14 18C10 2 40 4 36 21L29 12Z" fill="#4e5c58"/></svg></div>`}
function card(v,s){return `<div class="card ${['♥','♦'].includes(s)?'red':''}" aria-label="${v}${s}"><span class="value">${v}<small>${s}</small></span><span class="suit">${s}</span></div>`}
function board(){return `<div class="cards">${card('A','♦')+card('9','♣')+card('6','♥')}<div class="card blank" aria-label="轉牌未發"></div><div class="card blank" aria-label="河牌未發"></div></div>`}
function hand(){return `<div class="cards">${card('A','♠')+card('K','♥')}</div>`}
function pot(){return '<div class="pot"><small>底池</small><strong><span class="chip">◉◉</span>1,200</strong></div>'}
const people=[['海鹽','6,250','已過牌'],['阿澤','3,600','下注 200'],['松','9,800','跟注 200'],['霧','7,400','已棄牌']];
function person(i,pos,portraits=true){const [n,b,m]=people[i];return `<div class="person ${pos}">${portraits?portrait(i):''}<div><div class="name">${n}${i===0?'<span class="dealer">D</span>':i>1?' <small>NPC</small>':''}</div><div class="balance">${b}</div>${variant==='E'?`<div class="status">${m}</div>`:''}</div></div>`}
function actions(){return `<section class="actions"><div class="turnhead"><span>${acted?'等待其他玩家':'輪到你行動'}</span><span><strong>${acted?'—':'15'}</strong> <span class="muted mini">秒</span></span></div><div class="track"><span style="width:${acted?0:70}%"></span></div><div class="action-buttons"><button data-play="棄牌" ${acted?'disabled':''}>棄牌<small>放棄本手</small></button><button data-play="跟注 200" ${acted?'disabled':''}>跟注<small>200</small></button><button class="primary" data-modal="raise" ${acted?'disabled':''}>加注<small>選擇金額</small></button></div><div class="bank"><span>補時池 60 / 60 秒</span><span>每次 +5 秒，最多 4 次</span></div></section>`}
function tools(){return '<div class="tools"><button data-modal="topup">補碼</button><button data-info="sit">下手坐出</button><button data-modal="leave">離桌</button><button data-modal="cards">牌面特寫</button><button data-reset>重播</button></div>'}
function activity(){return '<div class="activity"><h3>本手動態</h3><p><span>海鹽</span><b>過牌</b></p><p><span>阿澤</span><b>下注 200</b></p><p><span>松 · NPC</span><b>跟注 200</b></p><div class="divider"></div><h3>桌上資金</h3><p><span>本次帶入</span><b>4,000</b></p><p><span>本手已投入</span><b>200</b></p></div>'}
function lobby(){return `<div class="lobby h-lobby"><h1>${variant==='G'?'找個位置，坐下來。':'今晚，留一個位置。'}</h1><p>你的 Discord 社群牌桌。50 / 100 盲注。</p><div class="room-list">${['晚餐後來幾手','留一盞燈'].map((n,i)=>`<article class="room-row"><div><h3>${n}</h3><p>${i?'固定高手 NPC 陪你練習':'真人與固定高手 NPC 同桌'}</p></div><span class="muted mini">${i?3:5} / 6 席</span><button class="primary" data-join="${n}">入座</button></article>`).join('')}</div><div class="tools"><button data-modal="create">開新桌</button><button data-info="invite">私人桌邀請</button></div></div>`}
function VariantH(){return `<header class="top h-top">${logo()}${nav()}${wallet()}</header>${screen==='lobby'?lobby():`<main class="h-wrap">${roomhead()}<div class="h-scene"><div class="h-floor"></div><div class="h-table"></div><div class="h-center">${pot()}${board()}<p class="street">翻牌圈</p></div>${['n','nw','ne','sw'].map((p,i)=>person(i,p)).join('')}<div class="person se empty">空位</div><div class="h-hero">${hand()}<div class="hero-info">你 <b>3,800</b></div></div></div><div class="h-bottom"><div class="aside-text"><span class="dot"></span>連線穩定<br>真人與固定高手 NPC 同桌</div><div>${actions()}${tools()}</div><div class="aside-text right">阿澤下注 200<br>松跟注 200<br>現在輪到你</div></div></main>`}`}
function render(){document.body.dataset.variant=variant;root.innerHTML=`<div class="app"><div class="demo-note"><span>美術探索 ${variant}　${designs[variant][0]}</span><span>${designs[variant][1]} ／ 模擬資料</span></div>${VariantH()}</div><nav class="switcher" aria-label="美術方案"><span class="label">J 系列<br>← → 切換</span><button class="arrow" data-cycle="-1" aria-label="上一款">‹</button>${Object.entries(designs).map(([k,[n]])=>`<button class="${k===variant?'selected':''}" aria-pressed="${k===variant}" data-variant="${k}">${k} ${n}</button>`).join('')}<button class="arrow" data-cycle="1" aria-label="下一款">›</button></nav>`}
function changeVariant(v){variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);overlay.innerHTML='';render()}
function cycle(n){const k=Object.keys(designs);changeVariant(k[(k.indexOf(variant)+n+4)%4])}
function notify(t){clearTimeout(timer);document.getElementById('toast').innerHTML=`<div class="toast">${esc(t)}</div>`;timer=setTimeout(()=>document.getElementById('toast').innerHTML='',3500)}
function dialog(type,name){if(type==='cards'){overlay.innerHTML=`<div class="shade"><section class="dialog card-detail" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">牌面特寫</h2><p>深黑與清楚的紅色花色，搭配乾淨白色牌底。</p><div class="cards">${card('A','♠')+card('K','♥')+card('9','♣')+card('6','♦')}</div><div class="buttons"><button class="primary" data-close>回到牌桌</button></div></section></div>`;overlay.querySelector('button').focus();return}const opts={raise:['加注至','示範加注外觀；沒有連接真實牌局。',600,'確認加注'],topup:['手後補碼','補碼申請會在本手結算後生效。',2000,'申請補碼'],leave:['手後離桌','本手結束後退回剩餘籌碼。',null,'確認離桌'],join:['帶入籌碼',(name||'牌桌')+'。帶入範圍 2,000～10,000。',4000,'入座'],create:['開新桌','示範建立公開桌，50 / 100 盲注。',4000,'開桌並入座']};const [t,d,v,b]=opts[type];overlay.innerHTML=`<div class="shade"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">${t}</h2><p>${esc(d)}</p>${v!==null?`<label for="amount">籌碼</label><input id="amount" type="number" value="${v}" min="1">`:''}<div class="buttons"><button class="secondary" data-close>取消</button><button class="primary" data-submit="${type}" data-room="${esc(name||'朋友小聚')}">${b}</button></div></section></div>`;overlay.querySelector('input,button').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.variant){changeVariant(b.dataset.variant);return}if(b.dataset.cycle){cycle(Number(b.dataset.cycle));return}if(b.dataset.nav){screen=b.dataset.nav;render();return}if(b.dataset.join){dialog('join',b.dataset.join);return}if(b.dataset.modal){dialog(b.dataset.modal);return}if(b.hasAttribute('data-close')){overlay.innerHTML='';return}if(b.hasAttribute('data-reset')){acted=false;render();notify('已回到你的回合。');return}if(b.dataset.info){notify({stats:'此輪先比較美術，個人統計尚未接入。',sit:'已預約下手坐出（示範）。',invite:'私人桌使用可重設邀請連結（本頁僅示意）。'}[b.dataset.info]);return}if(b.dataset.play){acted=true;render();notify('已'+b.dataset.play+'（示範）。');return}if(b.dataset.submit){const t=b.dataset.submit,n=Number(document.getElementById('amount')?.value);if(['join','create','raise','topup'].includes(t)&&(!Number.isInteger(n)||n<=0)){notify('請填入正整數籌碼。');return}if(['join','create'].includes(t)&&(n<2000||n>10000)){notify('帶入範圍為 2,000～10,000。');return}overlay.innerHTML='';if(['join','create'].includes(t)){screen='table';room=b.dataset.room;acted=false;render();notify('已入座（示範）。')}else if(t==='leave'){screen='lobby';render();notify('示範返回大廳；正式版會等待本手結算。')}else if(t==='raise'){acted=true;render();notify('已加注至 '+n+'（示範）。')}else notify('已預約手後補碼（示範）。')}});
document.addEventListener('keydown',e=>{if(overlay.innerHTML){if(e.key==='Escape')overlay.innerHTML='';if(e.key==='Tab'){const q=[...overlay.querySelectorAll('input,button')];if(e.shiftKey&&document.activeElement===q[0]){e.preventDefault();q.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===q.at(-1)){e.preventDefault();q[0].focus()}}return}if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});render();
</script></body></html>
