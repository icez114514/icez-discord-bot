rap}.scenarios button{padding:5px 8px;font-size:12px;min-height:38px}.scenario-info{margin:10px 0;font-size:13px;color:var(--muted)}.log{padding-left:18px;margin:10px 0 0;font-size:12px;color:var(--muted)}.log li{margin:5px 0}.modal-shade{position:absolute;inset:0;background:#07111dc9;z-index:5;display:flex;align-items:flex-start;justify-content:center;padding:70px 20px 30px}.modal{width:100%;max-width:420px;background:#20364b;border:1px solid #58758e;border-radius:14px;padding:22px;box-shadow:0 20px 80px #0008}.modal .row{margin-top:18px}.modal .row button{flex:1}.modal p{color:var(--muted);font-size:13px;margin:8px 0}.presets button{padding:5px 10px;min-height:36px}.stats{width:100%;border-collapse:collapse;font-size:14px}.stats th,.stats td{text-align:left;padding:14px 6px;border-bottom:1px solid var(--line)}.stats th{font-size:12px;color:var(--muted);font-weight:400}.stats td:last-child{text-align:right}.filters{display:flex;gap:8px;margin:18px 0}.stat-hero{font-size:40px;font-weight:700;margin-top:15px}.demo-footer{padding:12px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.status{min-height:48px;padding:10px 20px;background:#283f55;font-size:13px}.pending{color:#cbd6df}.admin-grid{display:grid;gap:12px;margin-top:20px}.warning-text{color:var(--bad)}@container(max-width:600px){.appbar{padding:14px}.brand{font-size:16px}.balances strong{font-size:16px}.nav{padding:8px;gap:4px}.nav button{font-size:12px}.content{padding:18px 14px}.section-head h2{font-size:20px}.table-row{grid-template-columns:1fr 72px;gap:8px}.table-row .occupancy{display:none}.table-row button{padding:5px 7px;font-size:13px}.arena{height:410px;margin:0 8px}.felt{inset:45px 27px 65px;border-width:7px}.seat{min-width:82px;padding:5px;font-size:12px}.seat strong{font-size:12px}.seat.top{top:4px}.seat.left,.seat.right{top:106px}.seat.bottom-left,.seat.bottom-right{bottom:88px;min-width:75px}.seat.bottom-left{left:0}.seat.bottom-right{right:0}.seat.hero{bottom:0;min-width:138px}.felt .card{width:32px;height:48px;font-size:19px}.felt .card span{font-size:15px}.felt .cards{gap:4px}.pot{font-size:18px}.actions{padding:15px 12px}.roomhead{padding:14px 12px}.roomhead h2{font-size:17px}.roomtools{padding:10px;gap:5px}.roomtools button{font-size:12px}.bankline{font-size:11px}.summary{padding:10px 12px}.modal-shade{padding:35px 10px}.modal{padding:18px}.stats{font-size:12px}.timerline{font-size:12px}.ruleline{gap:8px}.app{min-height:700px}}@media(max-width:900px){.workspace{grid-template-columns:1fr;padding:0 10px 24px}.prototype-head{padding:18px 14px}.aside{display:grid;grid-template-columns:1fr 1fr;gap:12px}.aside section{margin:0}.device.phone{max-width:390px}}@media(max-width:540px){.aside{display:block}.aside section{margin-top:12px}.prototype-head h1{font-size:22px}.prototype-head p{font-size:13px}}
</style></head><body>
<header class="prototype-head"><span class="tag">互動原型・模擬資料</span><h1>從入座到下一手，操作是否順手？</h1><p>試試大廳入桌、底部下注、自動補時與斷線重連。這是可丟棄的流程原型，沒有連接 Discord、資料庫或真正的撲克引擎；關閉或重新整理會重置示範資料。</p></header>
<main class="workspace"><div class="device" id="device"><div class="app" id="app"></div></div><aside class="aside">
<section><h3>預覽尺寸</h3><div class="row"><button id="wide">桌面</button><button id="phone">手機直向</button></div><p class="scenario-info">手機上下注按鈕位於牌桌下方，不與離桌按鈕混在一起。</p></section>
<section><h3>目前狀態</h3><dl class="state-list" id="state"></dl></section>
<section><h3>流程示範</h3><div class="scenarios" id="scenarios" role="tablist" aria-label="流程示範"></div><p class="scenario-info" id="scenario-info"></p><button class="primary" id="step">開始示範</button></section>
<section><h3>自由操作</h3><p class="scenario-info">示範時間由你控制，不會在閱讀時自動過期。</p><div class="row"><button data-action="tick5">前進 5 秒</button><button data-action="tick20">前進 20 秒</button></div><div class="row" style="margin-top:8px"><button data-action="disconnect">模擬斷線</button><button data-action="reconnect">重新連線</button></div><div class="row" style="margin-top:8px"><button data-action="finish">完成本手</button><button data-action="reset">全部重置</button></div><ol class="log" id="log"></ol></section>
<section><h3>本輪待確認</h3><p class="scenario-info">暫採：不提供觀戰；私桌用可重設邀請連結；管理員用帳號白名單，牌桌／資金權限分開。原型的權限切換只為展示。</p><label for="role">示範身分</label><select id="role"><option value="player">一般玩家</option><option value="tableAdmin">牌桌管理員</option><option value="fundAdmin">資金管理員</option></select></section>
</aside></main>
<script>
// Pure, in-memory interaction model. Deliberately not a poker engine or real authorization layer.
const Model=(()=>{
 const initial=()=>({login:false,screen:'lobby',room:null,host:false,wallet:50000,stack:0,assets:50000,bank:60,progress:0,hands:0,phase:'outside',countdown:0,remaining:0,extensions:0,invested:0,folded:false,connected:true,disconnectLeft:120,seatLeft:120,sitout:false,sitAfter:false,leaveAfter:false,topup:0,npcs:2,nextNpcs:null,hand:0,role:'player',notice:'請先使用示範登入。',log:[],period:'all',group:'all',inviteVersion:1,closing:false});
 function reduce(old,a){const s=structuredClone(old);const note=t=>{s.notice=t;s.log=[t,...s.log].slice(0,5)};
  const release=()=>{s.wallet+=s.stack;s.stack=0;s.room=null;s.phase='outside';s.screen='lobby';s.topup=0;s.leaveAfter=false;s.sitout=false;s.sitAfter=false;s.host=false;s.closing=false;note('已離桌，剩餘桌上籌碼退回帳戶。Time Bank 保留。')};
  const start=()=>{s.hand++;s.folded=false;s.phase='turn';s.remaining=20;s.extensions=0;s.invested=Math.min(s.stack,100);s.stack-=s.invested;note('本手開始。示範輪到你，基本行動時間 20 秒。')};
  const canAct=()=>s.phase==='turn'&&s.connected&&!s.sitout&&!s.leaveAfter;
  switch(a.type){
   case 'RESET':return initial();
   case 'LOGIN':s.login=true;note('示範登入成功，假設已通過指定伺服器資格。');break;
   case 'NAV':if(!s.login){note('請先登入。');break}if(s.room&&a.screen!=='table'){note('你仍在牌桌。請先離桌，避免把頁面切換誤當成觀戰。');break}s.screen=a.screen;break;
   case 'JOIN':if(!s.login||s.room){note('請先登入；每個帳戶只能同時入一桌。');break}if(!Number.isInteger(a.amount)||a.amount<2000||a.amount>10000||a.amount>s.wallet){note('帶入需為 2,000～10,000，且不可超過可用餘額。');break}s.wallet-=a.amount;s.stack=a.amount;s.room=a.room;s.host=!!a.host;s.npcs=a.npcs??2;s.nextNpcs=null;s.screen='table';s.connected=true;s.phase='countdown';s.countdown=5;s.sitout=false;s.seatLeft=120;s.disconnectLeft=120;note('已帶入 '+a.amount.toLocaleString()+'。示範目前在手間，5 秒後開手。');break;
   case 'TICK':for(let i=0;i<a.seconds;i++){
    if(!s.room)break;
    if(!s.connected){s.disconnectLeft=Math.max(0,s.disconnectLeft-1);if(!s.disconnectLeft){s.leaveAfter=true;if(['countdown','waiting','sitout'].includes(s.phase)){release();break}}}
    if(s.sitout){s.seatLeft=Math.max(0,s.seatLeft-1);if(!s.seatLeft){release();break}}
    if(s.phase==='countdown'&&!s.sitout&&!s.leaveAfter&&s.connected){if(--s.countdown<=0){if(s.npcs>=1&&s.stack>0)start();else{s.phase='waiting';note('等待另一位參與者；只有你一人時不開手。')}}}
    else if(s.phase==='turn'){s.remaining=Math.max(0,s.remaining-1);if(s.remaining===0){if(s.bank>=5&&s.extensions<4){s.bank-=5;s.extensions++;s.remaining=5;note('自動補時 +5 秒，本次已補 '+s.extensions+'/4 次。')}else{s.phase='opponents';s.folded=true;s.sitAfter=true;note('示範此時需要跟注：已逾時棄牌，手後自動坐出。')}}}
   }break;
   case 'ACT':if(!canAct()){note('目前不能操作：需保持連線且輪到你。');break}if(a.action==='fold'){s.folded=true;s.phase='opponents';note('已棄牌，等待本手結算。')}else{let pay=a.action==='call'?Math.min(100,s.stack):a.action==='allin'?s.stack:Number(a.amount)-s.invested;if(!Number.isInteger(pay)||pay<=0||pay>s.stack||(a.action==='raise'&&pay+s.invested<400)){note('示範最低加注至 400，且不可超過桌上籌碼。');break}s.stack-=pay;s.invested+=pay;s.phase=s.stack===0?'allin':'opponents';note(a.action==='allin'?'已全下，保留攤牌資格。':a.action==='call'?'已跟注 100，等待其他玩家。':'已加注至 '+s.invested.toLocaleString()+'。')}break;
   case 'NEXT_TURN':if(!s.room||s.stack===0||!['opponents'].includes(s.phase)||s.sitAfter||s.folded){note('此狀態不能再次行動。');break}s.phase='turn';s.remaining=20;s.extensions=0;note('模擬同街再次輪到你：20 秒與四次上限重設，池餘額保留。');break;
   case 'FINISH':if(!s.room||!['turn','opponents','allin'].includes(s.phase)){note('目前沒有進行中的手牌可結算。');break}{const net=a.result==='void'?0:(a.result==='loss'||s.folded)?-s.invested:300;s.stack+=s.invested+net;s.invested=0;if(a.result!=='void'){s.assets+=net;s.hands++;s.progress++;if(s.progress===10){s.progress=0;s.bank=Math.min(60,s.bank+5)}}if(s.topup){const add=s.topup;s.topup=0;if(s.wallet>=add&&s.stack+add>=2000&&s.stack+add<=10000){s.wallet-=add;s.stack+=add}else note('排隊補碼未符合手後餘額限制，未扣款。')}if(s.nextNpcs!==null){s.npcs=s.nextNpcs;s.nextNpcs=null}if(s.leaveAfter||s.closing){release();break}s.sitout=s.sitAfter||s.stack===0;s.sitAfter=false;s.phase=s.sitout?'sitout':s.npcs>0?'countdown':'waiting';s.seatLeft=120;s.countdown=5;note(a.result==='void'?'示範整手作廢，投入退回，不增加手數。':'示範結算：'+(net>=0?'+':'')+net+' 籌碼。'+(s.sitout?'已坐出，座位保留 2 分鐘。':'準備下一手。'))}break;
   case 'TOPUP':if(!s.room){note('尚未入桌。');break}if(!Number.isInteger(a.amount)||a.amount<=0||a.amount>s.wallet){note('請輸入不超過可用餘額的正整數。');break}if(['turn','opponents','allin'].includes(s.phase)){s.topup=a.amount;note('補碼 '+a.amount.toLocaleString()+' 已排隊，手間重新檢查後生效。')}else if(s.stack+a.amount<2000||s.stack+a.amount>10000){note('補碼後桌上籌碼需為 2,000～10,000。')}else{s.wallet-=a.amount;s.stack+=a.amount;note('補碼已完成。若已坐出，請按「重新坐入」。')}break;
   case 'SIT':if(!s.room)break;if(['turn','opponents','allin'].includes(s.phase)){s.sitAfter=true;note('已預約本手結束後坐出。')}else{s.sitout=true;s.phase='sitout';s.seatLeft=120;note('已坐出，不發牌、不扣盲注，座位保留 2 分鐘。')}break;
   case 'RETURN':if(!s.room||!s.sitout)break;if(s.stack<2000){note('請先補碼至至少 2,000。');break}s.sitout=false;s.phase=s.npcs?'countdown':'waiting';s.countdown=5;note('已重新坐入，下一手參與。');break;
   case 'LEAVE':if(!s.room)break;if(['turn','opponents','allin'].includes(s.phase)){s.leaveAfter=true;note('已預約手後離桌，投入與全下資格保留。')}else release();break;
   case 'DISCONNECT':if(!s.room){note('請先入桌再試斷線。');break}if(s.connected){s.connected=false;s.disconnectLeft=120;note('已模擬斷線，行動計時照常，座位與介面心跳寬限 2 分鐘。')}break;
   case 'RECONNECT':if(!s.room){note('目前沒有可恢復的座位。');break}s.connected=true;note(s.leaveAfter?'寬限已過，仍會在手後離桌。':'已回到同一牌桌，行動時間及補時池不重置。');break;
   case 'NPC':if(!s.host){note('只有房主可調整固定 NPC。');break}if(a.count<0||a.count>5)break;if(['turn','opponents','allin'].includes(s.phase)){s.nextNpcs=a.count;note('NPC 數量將在本手結束後改為 '+a.count+'。')}else{s.npcs=a.count;if(!s.sitout){s.phase=a.count?'countdown':'waiting';s.countdown=5}note('固定 NPC 數量已更新。')}break;
   case 'ROLE':s.role=a.role;note('已切換原型示範權限，並非真正管理員授權。');break;
   case 'ADMIN_CLOSE':if(s.role!=='tableAdmin'){note('此身分沒有牌桌管理權。');break}if(s.room){s.closing=true;s.leaveAfter=true;if(!['turn','opponents','allin'].includes(s.phase))release();else note('管理關桌已排程，本手結算後執行。')}else note('示範牌桌已標記停止開新手。');break;
   case 'ADJUST':if(s.role!=='fundAdmin'){note('此身分沒有資金管理權。');break}if(!Number.isInteger(a.amount)||!a.reason?.trim()||s.wallet+a.amount<0){note('須填原因、整數金額，且不能造成負餘額。');break}s.wallet+=a.amount;s.assets+=a.amount;note('示範資金調整 '+a.amount+'；原因：'+a.reason);break;
   case 'INVITE_RESET':if(s.host&&s.room?.private){s.inviteVersion++;note('示範邀請已重設，舊連結失效；不踢出已入座者。')}break;
   case 'FILTER':s[a.key]=a.value;break;
   case 'SEED_BANK':s.bank=25;s.progress=9;note('情境資料：補時池 25 秒，累計 9/10 手。');break;
  }return s;
 }return {initial,reduce};
})();
</script>
<script>
let state=Model.initial(),modal=null,scenario='join',stepIndex=0,phone=false;
const app=document.getElementById('app');const money=n=>n.toLocaleString('en-US');const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rooms=[{name:'晚餐後來幾手',private:false},{name:'練習桌',private:false},{name:'週二小聚',private:false}];
const scenarios={
 join:{title:'入桌',text:'登入 → 帶入籌碼 → 五秒開手 → 跟注 → 完成本手。',steps:[['示範登入',{type:'LOGIN'}],['帶入 4,000',{type:'JOIN',amount:4000,room:rooms[0],host:true,npcs:2}],['經過 5 秒，開手',{type:'TICK',seconds:5}],['跟注 100',{type:'ACT',action:'call'}],['示範結算 +300',{type:'FINISH'}]]},
 bank:{title:'自動補時',text:'池內 25 秒、已累計 9 手。連續四次補時後逾時，完成第十手獲得 5 秒。',seed:true,steps:[['用完基本 20 秒',{type:'TICK',seconds:20}],['用完第一段 5 秒',{type:'TICK',seconds:5}],['用完第二段 5 秒',{type:'TICK',seconds:5}],['用完第三段 5 秒',{type:'TICK',seconds:5}],['第四段用完，棄牌',{type:'TICK',seconds:5}],['結算並坐出',{type:'FINISH',result:'loss'}]]},
 reconnect:{title:'斷線',text:'斷線後時鐘仍走。短暫重連不重置時間；超過兩分鐘則手後離桌。',seed:true,steps:[['模擬斷線',{type:'DISCONNECT'}],['經過 10 秒',{type:'TICK',seconds:10}],['重連，同一手繼續',{type:'RECONNECT'}],['再次斷線',{type:'DISCONNECT'}],['經過 120 秒',{type:'TICK',seconds:120}],['結算後退桌',{type:'FINISH',result:'loss'}]]},
 topup:{title:'補碼／離桌',text:'手中補碼不立刻增加桌上可用籌碼；先結算、再補碼，之後離桌返還餘額。',seed:true,steps:[['申請補碼 2,000',{type:'TOPUP',amount:2000}],['完成本手並補碼',{type:'FINISH'}],['離桌退回剩餘',{type:'LEAVE'}]]},
 allin:{title:'全下保留',text:'全下後離桌不能拿回已押注籌碼，但仍有攤牌資格。用模擬派彩展示等待與退桌。',seed:true,steps:[['全下',{type:'ACT',action:'allin'}],['申請離桌',{type:'LEAVE'}],['示範結算後退桌',{type:'FINISH'}]]}
};
function dispatch(a){state=Model.reduce(state,a);render()}
function startScenario(key){scenario=key;stepIndex=0;state=Model.initial();modal=null;if(scenarios[key].seed){state=Model.reduce(state,{type:'LOGIN'});state=Model.reduce(state,{type:'JOIN',amount:4000,room:rooms[0],host:true,npcs:2});state=Model.reduce(state,{type:'TICK',seconds:5});if(key==='bank')state=Model.reduce(state,{type:'SEED_BANK'})}render()}
function card(v,red=false){return `<div class="card ${red?'red':''}">${v[0]}<span>${v[1]}</span></div>`}
function header(){return `<div class="appbar"><div class="brand"><span class="suit">♠</span>德撲俱樂部</div><div class="balances">可用籌碼<br><strong>${money(state.wallet)}</strong></div></div><nav class="nav" aria-label="主要功能">${[['lobby','公開大廳'],['rank','資產榜'],['stats','我的數據'],...(state.room?[['table','回到牌桌']]:[]),...(state.role!=='player'?[['admin','管理']]:[])].map(([id,t])=>`<button data-nav="${id}" class="${state.screen===id?'selected':''}">${t}</button>`).join('')}</nav>`}
function lobby(){return `<div class="content"><div class="section-head"><h2>找一桌，坐下來。</h2><button class="primary" data-modal="create">開新桌</button></div><div class="ruleline"><span>小盲 50 / 大盲 100</span><span>帶入 2,000～10,000</span><span>最多 6 人</span></div><div class="table-list">${rooms.map((r,i)=>`<div class="table-row"><div><h3>${r.name}</h3><small>${i===1?'固定高手 NPC 陪你練習':'真人與固定 NPC 同桌'}<br>公開桌</small></div><div class="occupancy">${[3,2,6][i]} / 6 席</div><button ${i===2?'disabled':''} data-join="${i}">${i===2?'已滿桌':'選擇帶入'}</button></div>`).join('')}</div><div class="notice">私人桌不列在大廳。持有邀請連結的合格成員才能加入。<br><small>此邀請方案尚待你確認。</small></div><button class="quiet" data-modal="invite">用私人桌邀請加入</button><p class="muted" style="margin-top:22px;font-size:13px">首次籌碼 50,000。資產包含帳戶及已結算的桌上籌碼；與原有水晶分開。</p></div>`}
function table(){const active=['turn','opponents','allin'].includes(state.phase),heroCards=active?card(['A','♠'])+card(['K','♥'],true):'<small>下一手發牌</small>';let status=state.phase==='turn'?'輪到你':state.phase==='allin'?'已全下，等待攤牌':state.phase==='opponents'?'等待其他玩家':state.sitout?'已坐出':state.phase==='countdown'?state.countdown+' 秒後開手':'等待參與者';
 return `<div class="roomhead"><div><h2>${esc(state.room.name)}</h2><small>${state.room.private?'私人桌':'公開桌'}　50 / 100　${state.host?'你是房主':'玩家'}</small></div><span class="tag">第 ${state.hand||'—'} 手</span></div>${!state.connected?'<div class="summary warning-text">連線中斷。'+state.disconnectLeft+' 秒寬限；行動計時照常。</div>':''}<div class="arena"><div class="felt"><div><small>${active?'翻牌前・示範局面':'準備下一手'}</small><div class="pot">底池 ${active?money(250+state.invested):'—'}</div><div class="cards">${Array.from({length:5},()=>'<div class="card back">?</div>').join('')}</div><small style="margin-top:12px">${status}</small></div></div>${['top','left','right','bottom-left','bottom-right'].map((pos,i)=>`<div class="seat ${pos} ${i>=state.npcs?'empty':''}">${i<state.npcs?`<strong>NPC ${i+1}${i===0?'<span class="dealer">D</span>':''}</strong><small>固定高手</small><strong>${money(i===0&&active?9800:10000)}</strong>`:'空位'}</div>`).join('')}<div class="seat hero"><div class="cards">${heroCards}</div><strong>你　${money(state.stack)}</strong><small>${state.sitout?'坐出':state.phase==='allin'?'全下':state.leaveAfter?'手後離桌':'桌上籌碼'}</small></div></div><div class="actions"><div class="timerline"><span>${status}</span><span>${state.phase==='turn'?'<strong>'+state.remaining+'</strong> 秒':'Time Bank '+state.bank+' 秒'}</span></div><div class="track"><div style="width:${state.phase==='turn'?Math.min(100,state.remaining/(state.extensions?5:20)*100):0}%"></div></div>${state.sitout?`<div class="row"><button class="primary grow" data-action="return">重新坐入</button><span class="muted">座位保留 ${state.seatLeft} 秒</span></div>`:`<div class="action-grid"><button data-play="fold" ${state.phase!=='turn'||!state.connected||state.leaveAfter?'disabled':''}>棄牌</button><button data-play="call" ${state.phase!=='turn'||!state.connected||state.leaveAfter?'disabled':''}>跟注 100</button><button class="primary" data-modal="raise" ${state.phase!=='turn'||!state.connected||state.leaveAfter?'disabled':''}>加注</button></div>`}<div class="bankline"><span>補時池 ${state.bank} / 60 秒</span><span>本次自動補時 ${state.extensions} / 4</span></div><div class="bankline"><span>再 ${10-state.progress} 手獲得 +5 秒</span><span>每段 +5 秒，自動使用</span></div></div>${state.topup||state.leaveAfter||state.sitAfter?`<div class="summary">${state.topup?'手後補碼 +'+money(state.topup)+'　':''}${state.leaveAfter?'本手結算後離桌　':''}${state.sitAfter?'本手結算後坐出':''}</div>`:''}<div class="roomtools"><button data-modal="topup">補碼</button><button data-action="sit">下手坐出</button>${state.host?'<button data-modal="npc">管理 NPC</button>':''}<button class="danger" data-modal="leave">離桌</button>${state.room.private&&state.host?'<button data-modal="share">邀請朋友</button>':''}</div>`}
function stats(){const small=state.period!=='all',n=small?36:120,values=state.group==='human'?[22,16,5,2,4,8]:state.group==='mixed'?[30,22,8,3,6,10]:[26,19,7,3,5,9];return `<div class="content"><h2>我的打法數據</h2><p class="muted">僅本人可見・以下為示範統計</p><div class="filters"><select id="period" aria-label="時間範圍">${[['all','累計'],['30','近 30 天'],['7','近 7 天']].map(([v,t])=>`<option value="${v}" ${state.period===v?'selected':''}>${t}</option>`).join('')}</select><select id="group" aria-label="對局分類">${[['all','全部'],['human','純真人'],['mixed','含 NPC']].map(([v,t])=>`<option value="${v}" ${state.group===v?'selected':''}>${t}</option>`).join('')}</select></div><p>有效手數 <strong>${n}</strong> ${small?'<span class="tag">樣本不足</span>':''}</p><table class="stats"><thead><tr><th>指標</th><th>次數 / 樣本</th><th>比例</th></tr></thead><tbody>${['VPIP 自願投入','PFR 翻牌前加注','3-Bet 再加注','面對 3-Bet 棄牌','Flop C-Bet','W$SD 攤牌分池'].map((t,i)=>{let d=i<2?n:[24,12,18,22][i-2],v=small?Math.min(values[i],Math.floor(d/3)):values[i];return `<tr><td>${t}${d<20?'<br><small>樣本不足</small>':''}</td><td>${v} / ${d}</td><td>${(100*v/d).toFixed(1)}%</td></tr>`}).join('')}</tbody></table><div class="notice">分到某個底池，不一定代表整手獲利。公開資料使用「淨贏牌率」，與攤牌分池率分開。</div></div>`}
function rank(){return `<div class="content"><h2>資產榜</h2><p class="muted">按目前已結算總資產排名・示範名單</p><table class="stats"><thead><tr><th>名次 / 玩家</th><th>手數 / 淨贏牌率</th><th>資產</th></tr></thead><tbody><tr><td>1　海鹽</td><td>326 / 24.8%</td><td>78,200</td></tr><tr><td>2　阿澤</td><td>198 / 26.3%</td><td>65,700</td></tr><tr><td>3　你</td><td>${state.hands} / —</td><td>${money(state.assets)}</td></tr></tbody></table><div class="notice">牌局中的下注不讓資產榜跳動。私人打法統計不公開，也不排名。</div></div>`}
function admin(){return `<div class="content"><h2>遊戲管理</h2><p class="muted">示範身分：${state.role==='fundAdmin'?'資金管理員':'牌桌管理員'}</p><div class="notice">一般 Discord 管理員不自動取得這些權限。正式版由服務端驗證白名單；此處只展示入口。</div><div class="admin-grid"><button data-action="close" ${state.role!=='tableAdmin'?'disabled':''}>本手結束後關閉牌桌</button><button data-modal="adjust" ${state.role!=='fundAdmin'?'disabled':''}>調整示範帳戶籌碼</button></div><p class="muted" style="margin-top:15px">關桌與資金管理分開授權；調整籌碼必填原因。</p></div>`}
function modalHtml(){if(!modal)return '';let title='',body='',submit='確認';switch(modal.type){case 'join':title='帶入籌碼';body=`<p>${esc(modal.room.name)}。可用 ${money(state.wallet)}；下一手開始參與。</p><label for="amount">帶入金額</label><input id="amount" type="number" value="4000" min="2000" max="10000" step="100"><div class="row presets"><button data-set="2000">2,000</button><button data-set="5000">5,000</button><button data-set="10000">10,000</button></div>`;submit='帶入並入座';break;
case 'create':title='開一張新桌';body='<label for="roomname">牌桌名稱</label><input id="roomname" maxlength="24" value="朋友小聚"><label for="privacy">可見性</label><select id="privacy"><option value="public">公開桌</option><option value="private">私人桌</option></select><label for="npcnum">固定高手 NPC</label><select id="npcnum"><option value="1">1 位</option><option value="2" selected>2 位</option><option value="5">5 位</option></select><label for="amount">帶入籌碼</label><input id="amount" type="number" min="2000" max="10000" step="100" value="4000"><p>私桌不列入公開大廳，房主可取得邀請連結。</p>';submit='開桌並入座';break;
case 'topup':title='補碼';body=`<p>${['turn','opponents','allin'].includes(state.phase)?'本手進行中，申請將排隊到結算後生效。':'手間補碼立即生效。'}可用 ${money(state.wallet)}。</p><label for="amount">追加籌碼</label><input id="amount" type="number" min="1" step="100" value="2000"><p>生效後桌上籌碼需介於 2,000～10,000。</p>`;submit='申請補碼';break;
case 'raise':title='加注';body=`<label for="amount">加注至（包含本街已投入）</label><input id="amount" type="number" min="400" max="${state.stack+state.invested}" value="400" step="100"><div class="row presets"><button data-set="400">400</button><button data-set="800">800</button><button data-set="${state.stack+state.invested}">全下額</button></div><p>最低加注至 400。全下前會再次確認。</p>`;submit='確認加注';break;
case 'allin':title='確認全下';body=`<p>你將押上剩餘 ${money(state.stack)} 籌碼。全下後即使離線，仍保留本手攤牌資格。</p>`;submit='確認全下';break;
case 'leave':title='離開牌桌？';body=`<p>${['turn','opponents','allin'].includes(state.phase)?'本手尚未結束，將在結算後退回剩餘籌碼。':'剩餘桌上籌碼會退回帳戶。'}Time Bank 不重置。</p>`;submit='確認離桌';break;
case 'npc':title='固定 NPC';body=`<label for="npcnum">NPC 人數</label><select id="npcnum">${Array.from({length:6},(_,i)=>`<option value="${i}" ${i===(state.nextNpcs??state.npcs)?'selected':''}>${i} 位</option>`).join('')}</select><p>手中調整在下一手才生效。只有一位真人且無 NPC 時，等待其他玩家加入。</p>`;submit='更新 NPC';break;
case 'invite':title='私人桌邀請';body='<p>這裡模擬打開邀請連結；不會連線或驗證真實邀請。</p><label for="invitecode">示範邀請碼</label><input id="invitecode" value="FRIENDS"><p>本原型接受 FRIENDS。</p>';submit='查看帶入選項';break;
case 'share':title='邀請朋友';body=`<p>房主可重設邀請，舊連結將失效。</p><label for="inviteurl">示範邀請連結（不可實際使用）</label><input id="inviteurl" readonly value="https://poker.example.invalid/invite/demo-${state.inviteVersion}"><p>實際版仍需登入及符合伺服器資格。</p>`;submit='重設邀請';break;
case 'adjust':title='調整示範籌碼';body='<label for="amount">增減金額</label><input id="amount" type="number" value="1000"><label for="reason">調整原因（必填）</label><input id="reason" maxlength="100" placeholder="例如：客服補發"><p>操作將顯示於本次示範紀錄。</p>';submit='記錄調整';break;}
return `<div class="modal-shade"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">${title}</h2>${body}<div class="row"><button data-cancel>取消</button><button class="primary" data-submit>${submit}</button></div></section></div>`}
function render(){app.innerHTML=header()+(!state.login?'<div class="login"><div class="spade">♠</div><h2>同一個社群，同一張牌桌。</h2><p>使用 Discord 身分加入。這次點擊僅模擬登入成功，不會開啟授權或讀取你的帳號。</p><button class="primary" data-action="login">模擬 Discord 登入</button></div>':state.screen==='table'&&state.room?table():state.screen==='stats'?stats():state.screen==='rank'?rank():state.screen==='admin'?admin():lobby())+`<div class="status" role="status">${esc(state.notice)}</div><footer class="demo-footer">介面原型，非真實牌局。模擬結算不根據牌力判定。</footer>`+modalHtml();
 const fields={'畫面':({lobby:'大廳',table:'牌桌',stats:'個人統計',rank:'資產榜',admin:'管理'})[state.screen],'目前階段':({outside:'未入座',countdown:'開手倒數',turn:'輪到你',opponents:'等待結算',allin:'全下等待',sitout:'坐出',waiting:'等待玩家'})[state.phase],'可用 / 桌上':money(state.wallet)+' / '+money(state.stack),'本手投入':money(state.invested),'已結算總資產':money(state.assets),'行動剩餘':state.remaining+' 秒','Time Bank':state.bank+' 秒，補 '+state.extensions+'/4 次','有效手進度':state.progress+'/10，完成 '+state.hands+' 手','連線':state.connected?'在線':'斷線，寬限 '+state.disconnectLeft+' 秒','每日檢查':state.room&&(state.connected||state.disconnectLeft>0)?'介面內，跳過':'無介面豁免','排隊補碼':money(state.topup),'離桌 / 坐出預約':(state.leaveAfter?'離桌 ':'')+(state.sitAfter?'坐出':'')||'無'};
 document.getElementById('state').innerHTML=Object.entries(fields).map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('');document.getElementById('log').innerHTML=state.log.map(t=>'<li>'+esc(t)+'</li>').join('');document.getElementById('role').value=state.role;
 document.getElementById('scenarios').innerHTML=Object.entries(scenarios).map(([k,s])=>`<button role="tab" aria-selected="${k===scenario}" data-scenario="${k}" class="${k===scenario?'primary':''}">${s.title}</button>`).join('');document.getElementById('scenario-info').textContent=scenarios[scenario].text;const steps=scenarios[scenario].steps;document.getElementById('step').textContent=stepIndex<steps.length?(stepIndex+1)+' / '+steps.length+'　'+steps[stepIndex][0]:'重新開始此流程';
}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav){dispatch({type:'NAV',screen:b.dataset.nav});return}if(b.dataset.join!==undefined){modal={type:'join',room:rooms[Number(b.dataset.join)]};render();return}if(b.dataset.modal){modal={type:b.dataset.modal};render();return}if(b.hasAttribute('data-cancel')){modal=null;render();return}if(b.dataset.set){document.getElementById('amount').value=b.dataset.set;return}if(b.dataset.play){dispatch({type:'ACT',action:b.dataset.play});return}if(b.hasAttribute('data-submit')){const type=modal.type,amount=Number(document.getElementById('amount')?.value);if(type==='raise'&&amount===state.stack+state.invested){modal={type:'allin'};render();return}if(type==='invite'){if(document.getElementById('invitecode').value.trim().toUpperCase()!=='FRIENDS'){state.notice='邀請碼無效，示範請輸入 FRIENDS。';modal=null;render();return}modal={type:'join',room:{name:'朋友私人桌',private:true}};render();return}let a;if(type==='join')a={type:'JOIN',amount,room:modal.room,npcs:2};if(type==='create')a={type:'JOIN',amount,room:{name:document.getElementById('roomname').value.trim()||'朋友小聚',private:document.getElementById('privacy').value==='private'},host:true,npcs:Number(document.getElementById('npcnum').value)};if(type==='topup')a={type:'TOPUP',amount};if(type==='raise')a={type:'ACT',action:'raise',amount};if(type==='allin')a={type:'ACT',action:'allin'};if(type==='leave')a={type:'LEAVE'};if(type==='npc')a={type:'NPC',count:Number(document.getElementById('npcnum').value)};if(type==='share')a={type:'INVITE_RESET'};if(type==='adjust')a={type:'ADJUST',amount,reason:document.getElementById('reason').value};modal=null;if(a)dispatch(a)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='reset'){startScenario('join');return}const map={login:{type:'LOGIN'},tick5:{type:'TICK',seconds:5},tick20:{type:'TICK',seconds:20},disconnect:{type:'DISCONNECT'},reconnect:{type:'RECONNECT'},finish:{type:'FINISH',result:state.folded?'loss':'win'},reset:{type:'RESET'},return:{type:'RETURN'},sit:{type:'SIT'},close:{type:'ADMIN_CLOSE'}};modal=null;dispatch(map[b.dataset.action])});
app.addEventListener('change',e=>{if(['period','group'].includes(e.target.id))dispatch({type:'FILTER',key:e.target.id,value:e.target.value})});document.getElementById('role').onchange=e=>dispatch({type:'ROLE',role:e.target.value});document.getElementById('wide').onclick=()=>{phone=false;document.getElementById('device').classList.remove('phone')};document.getElementById('phone').onclick=()=>{phone=true;document.getElementById('device').classList.add('phone')};document.getElementById('scenarios').onclick=e=>{const b=e.target.closest('[data-scenario]');if(b)startScenario(b.dataset.scenario)};document.getElementById('step').onclick=()=>{const steps=scenarios[scenario].steps;if(stepIndex>=steps.length){startScenario(scenario);return}dispatch(steps[stepIndex++][1])};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});render();
</script></body></html>
